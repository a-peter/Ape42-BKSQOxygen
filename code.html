<div
    id="Ape42_bksqo"
    class="visible"
    data-dragtarget="bksqo"
    data-dragarea="bksqo"
    data-defaultx="70"
    data-defaulty="55"
    style="position:absolute; pointer-events: all;">

    <!-- Pulse oximeter -->
    <div class="Ape42_bksqo_oxi">
        <div class="Ape42_bksqo_oxi_clip"></div>
        <div class="Ape42_bksqo_oxi_slot"></div>
        <div class="Ape42_bksqo_oxi_body">
            <div class="Ape42_bksqo_oxi_screen">
                <div class="Ape42_bksqo_oxi_label">SpO<sub>2</sub> %</div>
                <div id="Ape42_bksqo_spo2" class="Ape42_bksqo_oxi_value">--</div>
                <div class="Ape42_bksqo_oxi_heart">&#9829;</div>
            </div>
        </div>
    </div>

    <!-- Oxygen lever -->
    <div class="Ape42_bksqo_lever">
        <div class="Ape42_bksqo_lever_title">O<sub>2</sub></div>
        <div class="Ape42_bksqo_lever_label Ape42_bksqo_lever_off">OFF</div>
        <div class="Ape42_bksqo_lever_label Ape42_bksqo_lever_on">ON</div>
        <div class="Ape42_bksqo_lever_name">O<br>X<br>Y<br>G<br>E<br>N</div>
        <div class="Ape42_bksqo_lever_slot"></div>
        <div class="Ape42_bksqo_lever_grip"></div>
    </div>

    <!-- Oxygen bottle -->
    <div class="Ape42_bksqo_bottle">
        <div class="Ape42_bksqo_bottle_valve"></div>
        <div class="Ape42_bksqo_bottle_neck"></div>
        <div class="Ape42_bksqo_bottle_body">
            <div class="Ape42_bksqo_bottle_text">O<sub>2</sub></div>
            <div class="Ape42_bksqo_bottle_window">
                <div id="Ape42_bksqo_fill" class="Ape42_bksqo_bottle_fill"></div>
            </div>
        </div>
        <div id="Ape42_bksqo_psi" class="Ape42_bksqo_bottle_psi">---- PSI</div>
    </div>
</div>
